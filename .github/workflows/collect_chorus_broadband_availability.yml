name: Collect Internet availability - Chorus

on:
  schedule:
    - cron: '0 0 * * 2-6'  # 0:00 UTC (12:00/13:00 NZ) after trademe properties collected day.
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      NEON_DB: ${{ secrets.NEON_DB }}
      PYTHONPATH: . 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run the script
        run: |
          python internet_outage/get_broadband_availability.py
