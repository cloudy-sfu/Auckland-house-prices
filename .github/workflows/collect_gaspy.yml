name: Collect fuel prices - Gaspy

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      NEON_DB: ${{ secrets.NEON_DB }}
      GASPY_EMAIL: ${{ secrets.GASPY_EMAIL }}
      GASPY_PASSWORD: ${{ secrets.GASPY_PASSWORD }}
      PYTHONPATH: . 

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run the script
        run: |
          python fuel/get_gaspy.py
