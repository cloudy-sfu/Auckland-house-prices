name: Collect macroeconomics - Interest (Weekly)

on:
  schedule:
    - cron: '0 8 * * 5'  # Friday 8:00 UTC
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      NEON_DB: ${{ secrets.NEON_DB }}
      PYTHONPATH: . 

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run the script
        run: |
          python macroeconomics/ocr.py
          python macroeconomics/mortgage_rate.py
          python macroeconomics/wholesale_swap_rate.py
